Steps:
      - name: Deploy to EC2 Instance
        run: |
          echo "Starting deployment..."
          
          # 1. Navigate to the project directory
          cd /home/ec2-user/node-cicd/aws-ec2-cicd
          
          # 2. Pull the actual changes down (not just fetch)
          echo "1. Getting latest code..."
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Download any newly added npm libraries
          npm install --production
          
          # 4. Restart your application so the new code goes live
          # (Uncomment the line below if you use PM2 to manage the app)
          # pm2 restart all
